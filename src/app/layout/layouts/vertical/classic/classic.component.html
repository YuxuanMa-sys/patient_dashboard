<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Top Bar - Full Width (overlays sidebar) -->
<div
    class="bg-card fixed top-0 left-0 z-[60] flex h-16 w-full flex-0 items-center shadow dark:border-b dark:bg-transparent dark:shadow-none print:hidden"
>
    <!-- Navigation toggle button -->
    <button mat-icon-button (click)="toggleNavigation('mainNavigation')" class="ml-4">
        <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
    </button>
    
    <!-- Components -->
    <div class="ml-auto flex items-center space-x-0.5 pl-2 pr-4 sm:space-x-2 md:pr-6">
        <!-- <languages></languages>
        <fuse-fullscreen class="hidden md:block"></fuse-fullscreen> -->
        <search [appearance]="'bar'"></search>
        <!-- <shortcuts></shortcuts> -->
        <messages></messages>
        <notifications></notifications>
        <!-- <button
            class="lg:hidden"
            mat-icon-button
            (click)="quickChat.toggle()"
        >
            <mat-icon
                [svgIcon]="'heroicons_outline:chat-bubble-left-right'"
            ></mat-icon>
        </button> -->
        <user></user>
    </div>
</div>

<!-- Navigation -->
<fuse-vertical-navigation
    class="dark bg-gray-900 print:hidden"
    [mode]="isScreenSmall ? 'over' : 'side'"
    [name]="'mainNavigation'"
    [navigation]="navigation.default"
    [opened]="!isScreenSmall"
>
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
        <!-- Logo in sidebar -->
        <div class="flex h-10 items-center justify-center px-2 py-2 mt-4">
            <img
                class="h-6 w-auto"
                src="images/logo.png"
                alt="Logo"
            />
        </div>
    </ng-container>
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex w-full min-w-0 flex-auto flex-col pt-16">
    <!-- Content -->
    <div class="flex flex-auto flex-col">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        @if (true) {
            <router-outlet></router-outlet>
        }
    </div>

    <!-- Footer -->
    <div
        class="bg-card relative z-49 flex h-14 w-full flex-0 items-center justify-start border-t px-4 dark:bg-transparent md:px-6 print:hidden"
    >
        <span class="text-secondary font-medium"
            >4smile &copy; {{ currentYear }}</span
        >
    </div>
</div>
