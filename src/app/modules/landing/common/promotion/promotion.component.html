<div class="flex flex-col w-full max-w-md mx-auto bg-white rounded-lg shadow-lg">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-xl font-semibold text-gray-900">Create New Promotion</h2>
    </div>

    <!-- Content -->
    <div class="px-6 py-4 space-y-6">
        <form [formGroup]="form" class="space-y-6">
            <!-- Target Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-3">Target</label>
                <div class="flex space-x-4">
                    <div class="flex-1">
                        <div class="border-2 rounded-lg p-4 cursor-pointer transition-colors"
                             [class.border-blue-500]="selectedTarget === 'Individual'"
                             [class.bg-blue-50]="selectedTarget === 'Individual'"
                             [class.border-gray-200]="selectedTarget !== 'Individual'"
                             (click)="selectTarget('Individual')">
                            <div class="flex items-center justify-center space-x-2">
                                <mat-icon class="text-blue-600" svgIcon="heroicons_outline:user"></mat-icon>
                                <span class="font-medium text-blue-600">Individual</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1">
                        <div class="border-2 rounded-lg p-4 cursor-pointer transition-colors"
                             [class.border-blue-500]="selectedTarget === 'All'"
                             [class.bg-blue-50]="selectedTarget === 'All'"
                             [class.border-gray-200]="selectedTarget !== 'All'"
                             (click)="selectTarget('All')">
                            <div class="flex items-center justify-center space-x-2">
                                <mat-icon class="text-blue-600" svgIcon="heroicons_outline:user-group"></mat-icon>
                                <span class="font-medium text-blue-600">All</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recipient(s) Field -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Recipient(s)</label>
                <div class="bg-gray-50 rounded-lg p-3">
                    <span class="text-gray-600">{{ getRecipientText() }}</span>
                </div>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Title</label>
                <div class="bg-gray-50 rounded-lg p-3">
                    <input 
                        type="text" 
                        formControlName="title" 
                        placeholder="Title goes here"
                        class="w-full bg-transparent border-none outline-none text-gray-900 placeholder-gray-500">
                </div>
            </div>

            <!-- Details -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Details</label>
                <div class="bg-gray-50 rounded-lg p-3">
                    <textarea 
                        formControlName="description" 
                        placeholder="Lorem ipsum dolor set amit del partido de algao fil madr filhaal mje bilkul nhi pta"
                        rows="3"
                        class="w-full bg-transparent border-none outline-none text-gray-900 placeholder-gray-500 resize-none">
                    </textarea>
                </div>
            </div>

            <!-- Upload Image -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Upload Image</label>
                <div class="bg-gray-50 rounded-lg p-8">
                    <div class="text-center">
                        <div class="mb-4">
                            <mat-icon class="text-6xl text-gray-400" svgIcon="heroicons_outline:photo"></mat-icon>
                        </div>
                        <p class="text-gray-600 mb-2">
                            Drag an image or 
                            <button type="button" class="text-blue-600 hover:text-blue-800 font-medium" (click)="triggerFileInput()">
                                upload
                            </button>
                        </p>
                        <input 
                            #fileInput
                            type="file" 
                            class="hidden" 
                            accept="image/*" 
                            (change)="onImageSelect($event)">
                    </div>
                    
                    <!-- Image Preview -->
                    <div *ngIf="imagePreviewUrl" class="mt-4 text-center">
                        <img [src]="imagePreviewUrl" alt="Preview" class="max-w-full max-h-32 mx-auto rounded-lg">
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-200 flex space-x-3">
        <button 
            type="button" 
            class="flex-1 px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
            (click)="close()">
            Cancel
        </button>
        <button 
            type="button" 
            class="flex-1 px-4 py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
            [disabled]="!form.valid || loading"
            (click)="save()">
            Publish Promotion
        </button>
    </div>
</div>
