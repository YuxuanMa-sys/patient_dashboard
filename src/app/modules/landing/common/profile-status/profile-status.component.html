<div class="p-2 bg-card border shadow mb-3 rounded-lg py-3 ">
    <div class="grid md:grid-cols-2 grid-cols-1 gap-6">
        <div class="col-span-1">
            <div>
                <div class="text-lg font-medium text-dark">Complete your profile</div>
                <div class="font-normal text-1sm text-dark">
                    You still need some action to complete your profile
                </div>
            </div>
        </div>
        <div class="col-span-1">
            <div>
                <mat-progress-bar class="rounded-full py-2" [color]="'warn'" mode="determinate"
                    value="80"></mat-progress-bar>
                <div class="flex justify-between">
                    <div class="font-normal text-sm text-gray-400 mt-1">
                        Profile status
                    </div>
                    <div class="font-normal text-sm text-gray-400 mt-1">
                        90%
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
