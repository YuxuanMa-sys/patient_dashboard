<div class="flex flex-col w-full max-w-lg mx-auto bg-white rounded-2xl shadow-2xl announcement-modal">
    <!-- Header -->
    <div class="px-8 py-5 border-b border-gray-100 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-900">{{ getModalTitle() }}</h2>
        <button type="button" class="text-gray-400 hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0056FB] rounded-full transition-colors duration-150" (click)="close()">
            <mat-icon svgIcon="heroicons_outline:x-mark"></mat-icon>
        </button>
    </div>

    <!-- Content -->
    <div class="px-8 py-6 space-y-7">
        <form [formGroup]="form" class="space-y-7">
            <!-- Target Selection -->
            <div>
                <label class="block text-base font-semibold text-gray-700 mb-2">Target <span class="text-red-500">*</span></label>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <div class="border-2 rounded-xl p-4 cursor-pointer transition-colors text-center"
                             [class.border-[#0056FB]]="selectedTarget === 'Individual'"
                             [class.bg-blue-50]="selectedTarget === 'Individual'"
                             [class.border-gray-200]="selectedTarget !== 'Individual'"
                             (click)="selectTarget('Individual')">
                            <div class="flex items-center justify-center gap-2">
                                <mat-icon class="text-[#0056FB]" svgIcon="heroicons_outline:user"></mat-icon>
                                <span class="font-semibold text-[#0056FB]">Individual</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1">
                        <div class="border-2 rounded-xl p-4 cursor-pointer transition-colors text-center"
                             [class.border-[#0056FB]]="selectedTarget === 'All'"
                             [class.bg-blue-50]="selectedTarget === 'All'"
                             [class.border-gray-200]="selectedTarget !== 'All'"
                             (click)="selectTarget('All')">
                            <div class="flex items-center justify-center gap-2">
                                <mat-icon class="text-[#0056FB]" svgIcon="heroicons_outline:user-group"></mat-icon>
                                <span class="font-semibold text-[#0056FB]">All</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recipient(s) Field -->
            <div>
                <label class="block text-base font-semibold text-gray-700 mb-2">Recipient(s)</label>
                <div class="bg-gray-50 rounded-xl p-3">
                    <span class="text-gray-600">{{ getRecipientText() }}</span>
                </div>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-base font-semibold text-gray-700 mb-2">Title <span class="text-red-500">*</span></label>
                <input 
                    type="text" 
                    formControlName="title" 
                    placeholder="Title goes here"
                    class="w-full bg-gray-50 rounded-xl border border-gray-200 px-4 py-3 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#0056FB] focus:border-transparent font-medium">
            </div>

            <!-- Details -->
            <div>
                <label class="block text-base font-semibold text-gray-700 mb-2">Details <span class="text-red-500">*</span></label>
                <textarea 
                    formControlName="description" 
                    placeholder="Enter details here"
                    rows="3"
                    class="w-full bg-gray-50 rounded-xl border border-gray-200 px-4 py-3 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#0056FB] focus:border-transparent font-medium resize-none">
                </textarea>
            </div>

            <!-- Upload Image -->
            <div>
                <label class="block text-base font-semibold text-gray-700 mb-2">Upload Image</label>
                <div class="bg-gray-50 rounded-xl p-6 flex flex-col items-center justify-center gap-3">
                    <div class="flex flex-col items-center justify-center w-full">
                        <mat-icon class="text-5xl text-gray-300 mb-2" svgIcon="heroicons_outline:photo"></mat-icon>
                        <p class="text-gray-500 mb-2">
                            Drag an image or 
                            <button type="button" class="text-[#0056FB] hover:text-[#003a9c] font-semibold underline underline-offset-2" (click)="triggerFileInput()">
                                upload
                            </button>
                        </p>
                        <input 
                            #fileInput
                            type="file" 
                            class="hidden" 
                            accept="image/*" 
                            (change)="onImageSelect($event)">
                    </div>
                    <!-- Image Preview -->
                    <div *ngIf="imagePreviewUrl" class="w-full flex justify-center mt-2">
                        <img [src]="imagePreviewUrl" alt="Preview" class="max-w-full max-h-40 rounded-xl object-cover border border-gray-200 shadow-sm">
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="px-8 py-5 border-t border-gray-100 flex gap-3">
        <button 
            type="button" 
            class="flex-1 px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0056FB] font-semibold"
            (click)="close()">
            Cancel
        </button>
        <button 
            type="button" 
            class="flex-1 px-4 py-2 text-white bg-[#0056FB] rounded-xl hover:bg-[#003a9c] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0056FB] font-semibold shadow"
            [disabled]="!form.valid || loading"
            (click)="save()">
            {{ getActionButtonText() }}
        </button>
    </div>
</div>
