<div class="flex flex-col flex-auto md:w-140 md:max-w-140 w-full -m-6 pb-6 px-6">

    <div class="w-full">
        <div class="overflow-hidden pb-4">
            <div>
                <h2 class="text-xl font-normal tracking-normal leading-8 text-dark pt-3">Staff</h2>
            </div>
            <hr class="my-1">

            <div class="col-span-2">
                <div class="ring-bg-card relative flex h-32 w-full items-center justify-center overflow-hidden ring-4">
                    <!-- Overlay for the upload icon -->
                    <div class="absolute inset-0 z-10 bg-black bg-opacity-50"></div>

                    <!-- Icon for uploading the image -->
                    <div class="absolute inset-0 z-20 flex items-center justify-center">
                        <div>
                            <input id="profile-image-input"
                                class="pointer-events-none invisible absolute h-0 w-0 opacity-0" type="file"
                                [multiple]="false" [accept]="'image/jpeg, image/png'" (change)="onImageSelect($event)"
                                #imageInput />

                            <label
                                class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full hover:bg-hover"
                                for="profile-image-input" matRipple>
                                <mat-icon class="text-white" [svgIcon]="'heroicons_outline:camera'"></mat-icon>
                            </label>
                        </div>
                    </div>

                    <!-- Image Preview or Default Placeholder -->
                    <ng-container *ngIf="imagePreviewUrl; else defaultImageTemplate">
                        <img class="h-full w-full object-cover" [src]="imagePreviewUrl" alt="Image Preview" />
                    </ng-container>
                    <ng-template #defaultImageTemplate>
                        <div
                            class="flex h-full w-full items-center justify-center rounded-full bg-gray-200 text-8xl font-bold uppercase text-gray-600">
                            <span class="text-sm">No Image</span>
                        </div>
                    </ng-template>
                </div>
            </div>

            <form [formGroup]="form" class="grid mt-5 grid-cols-2 gap-x-5">
                <!-- Name -->
                <div class="col-span-1">
                    <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Name</mat-label>
                        <input matInput formControlName="name" placeholder="Name" />
                        <mat-error *ngIf="form.get('name')?.hasError('required')">
                            Name is required
                        </mat-error>
                    </mat-form-field>
                </div>
                <!-- Phone -->
                <div class="col-span-1">
                    <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Phone</mat-label>
                        <input matInput formControlName="phone" placeholder="Phone" />
                        <mat-error *ngIf="form.get('phone')?.hasError('required')">
                            Phone is required
                        </mat-error>
                        <mat-error *ngIf="form.get('phone')?.hasError('pattern')">
                            Phone must be a valid number
                        </mat-error>
                    </mat-form-field>
                </div>
                <!-- Bio -->
                <div class="col-span-2">
                    <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Bio</mat-label>
                        <textarea matInput formControlName="bio" placeholder="Bio"></textarea>
                    </mat-form-field>
                </div>

                <!-- Email -->
                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" placeholder="Email" />
                    <mat-error *ngIf="form.get('email')?.hasError('required')">
                        Email is required
                    </mat-error>
                    <mat-error *ngIf="form.get('email')?.hasError('email')">
                        Must be a valid email
                    </mat-error>
                </mat-form-field>

                <!-- Role Dropdown -->
                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Role</mat-label>
                    <mat-select formControlName="role">
                        <mat-option *ngFor="let role of roleOptions" [value]="role">
                            {{ role }}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="form.get('role')?.hasError('required')">
                        Role is required
                    </mat-error>
                </mat-form-field>

                <!-- Status Dropdown -->
                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Status</mat-label>
                    <mat-select formControlName="status">
                        <mat-option *ngFor="let status of statusOptions" [value]="status">
                            {{ status }}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="form.get('status')?.hasError('required')">
                        Status is required
                    </mat-error>
                </mat-form-field>

                <!-- Specialization -->
                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Specialization</mat-label>
                    <input matInput formControlName="specialization" placeholder="Specialization" />
                </mat-form-field>

                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Wort at</mat-label>
                    <input matInput formControlName="wort_at" placeholder="Wort at" />
                </mat-form-field>

                <div>
                    <label for="color-picker" class="mt-2">Select Color</label>
                    <input id="color-picker" type="color" formControlName="color" class="w-full h-10 border rounded" />
                </div>

                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Since</mat-label>
                    <input matInput formControlName="since" [matDatepicker]="since" placeholder="Since" />
                    <mat-datepicker-toggle matSuffix [for]="since"></mat-datepicker-toggle>
                    <mat-datepicker #since></mat-datepicker>
                </mat-form-field>


                <!-- Password -->
                <div class="col-span-2">
                    <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Password</mat-label>
                        <input matInput type="password" formControlName="password" placeholder="Password" />
                        <mat-error *ngIf="form.get('password')?.hasError('required')">
                            Password is required
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="col-span-2">
                    <!-- Save Button -->
                    <button mat-flat-button color="primary" class="mt-3" type="submit" (click)="save()">
                        Save
                    </button>
                </div>
                <!-- Loading Indicator and Error Message -->
                <div *ngIf="loading" class="mt-2">
                    <mat-spinner diameter="30"></mat-spinner>
                </div>
                <div *ngIf="error" class="mt-2 text-red-500">
                    {{ error }}
                </div>
            </form>
        </div>
    </div>
</div>
