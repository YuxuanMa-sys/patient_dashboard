<div class="flex flex-col flex-auto md:w-140 md:max-w-140 w-full -m-4 pb-4 px-4">

    <div class="w-full">
        <div class="overflow-hidden pb-2">
            <div>
                <h2 class="text-lg font-semibold tracking-normal leading-7 text-gray-900 pt-2">
                    {{ single === 'add' ? 'Add Provider' : 'Edit Provider' }}
                </h2>
            </div>
            <hr class="my-2">

            <form [formGroup]="form" class="space-y-3">
                
                <!-- Doctor Name -->
                <div>
                    <label class="block text-base font-medium text-gray-700 mb-1">Doctor Name</label>
                    <mat-form-field appearance="outline" class="w-full">
                        <input matInput formControlName="name" placeholder="Dr. Andrea Kelly" class="text-base" />
                        <mat-error *ngIf="form.get('name')?.hasError('required')" class="text-sm">
                            Name is required
                        </mat-error>
                    </mat-form-field>
                </div>

                <!-- Specialization -->
                <div>
                    <label class="block text-base font-medium text-gray-700 mb-1">Specialization</label>
                    <div class="flex items-center space-x-2">
                        <mat-form-field appearance="outline" class="flex-1">
                            <mat-select formControlName="specialization" class="text-base"></mat-select>
                        </mat-form-field>
                        <button type="button" class="text-blue-600 hover:text-blue-800 text-base font-medium">
                            + Add More
                        </button>
                    </div>
                </div>

                <!-- Professional Since -->
                <div>
                    <label class="block text-base font-medium text-gray-700 mb-1">Professional Since</label>
                    <mat-form-field appearance="outline" class="w-full">
                        <mat-select formControlName="since" class="text-base"></mat-select>
                    </mat-form-field>
                </div>

                <!-- Bio -->
                <div>
                    <label class="block text-base font-medium text-gray-700 mb-1">Bio</label>
                    <mat-form-field appearance="outline" class="w-full">
                        <textarea matInput formControlName="bio" rows="3" placeholder="Enter provider bio..." class="text-base"></textarea>
                    </mat-form-field>
                </div>

                <!-- Color -->
                <div>
                    <label class="block text-base font-medium text-gray-700 mb-1">Color</label>
                    <div class="flex items-center space-x-2">
                        <div class="flex items-center space-x-1">
                            <div class="w-6 h-6 rounded-full border-2 border-gray-300" [style.background-color]="form.get('color')?.value || '#ef4444'"></div>
                            <input #colorInput type="color" formControlName="color" class="sr-only" id="color-picker">
                        </div>
                        <button type="button" class="text-blue-600 hover:text-blue-800 text-base font-medium" (click)="colorInput.click()">
                            Choose color
                        </button>
                    </div>
                </div>

                <!-- Profile Image Upload -->
                <div>
                    <label class="block text-base font-medium text-gray-700 mb-1">Profile Image</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:border-gray-400 transition-colors"
                         (dragover)="onDragOver($event)" 
                         (dragleave)="onDragLeave($event)" 
                         (drop)="onDrop($event)">
                        
                        <!-- Image Preview or Upload Area -->
                        <ng-container *ngIf="imagePreviewUrl; else uploadTemplate">
                            <div class="relative inline-block">
                                <img [src]="imagePreviewUrl" 
                                     alt="Preview" 
                                     class="h-16 w-16 rounded-full object-cover mx-auto">
                                <button type="button" 
                                        (click)="removeImage()" 
                                        class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-base hover:bg-red-600">
                                    ×
                                </button>
                            </div>
                        </ng-container>
                        
                        <ng-template #uploadTemplate>
                            <div class="space-y-1">
                                <mat-icon class="mx-auto h-8 w-8 text-gray-400" [svgIcon]="'heroicons_outline:photo'"></mat-icon>
                                <div class="text-base text-gray-600">
                                    <span class="font-medium">Drag an image or </span>
                                    <button type="button" 
                                            class="text-blue-600 hover:text-blue-800 font-medium text-base"
                                            (click)="imageInput.click()">
                                        upload
                                    </button>
                                </div>
                            </div>
                        </ng-template>
                        
                        <input #imageInput
                               type="file" 
                               class="hidden" 
                               accept="image/*" 
                               (change)="onImageSelect($event)">
                    </div>
                </div>

                <!-- Hidden fields for system use -->
                <div class="hidden">
                    <mat-form-field appearance="outline" class="w-full">
                        <input matInput formControlName="email" placeholder="Email" />
                    </mat-form-field>
                    
                    <mat-form-field appearance="outline" class="w-full">
                        <input matInput formControlName="phone" placeholder="Phone" />
                    </mat-form-field>
                    
                    <mat-form-field appearance="outline" class="w-full">
                        <mat-select formControlName="role">
                            <mat-option value="Provider">Provider</mat-option>
                        </mat-select>
                    </mat-form-field>
                    
                    <mat-form-field appearance="outline" class="w-full">
                        <mat-select formControlName="status">
                            <mat-option value="Active">Active</mat-option>
                        </mat-select>
                    </mat-form-field>
                    
                    <mat-form-field appearance="outline" class="w-full">
                        <input matInput type="password" formControlName="password" placeholder="Password" />
                    </mat-form-field>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-between pt-3 border-t border-gray-200">
                    <button type="button" 
                            mat-stroked-button 
                            (click)="close()" 
                            class="px-4 py-1 text-base">
                        Cancel
                    </button>
                    <button type="button" 
                            mat-flat-button 
                            color="primary" 
                            (click)="save()" 
                            [disabled]="form.invalid || loading"
                            class="px-4 py-1 text-base">
                        <span *ngIf="!loading">{{ single === 'add' ? 'Add Provider' : 'Update Provider' }}</span>
                        <span *ngIf="loading" class="flex items-center">
                            <mat-progress-spinner diameter="16" mode="indeterminate" class="mr-2"></mat-progress-spinner>
                            {{ single === 'add' ? 'Adding...' : 'Updating...' }}
                        </span>
                    </button>
                </div>

                <!-- Error Message -->
                <div *ngIf="error" class="mt-2 p-2 bg-red-50 border border-red-200 rounded-md">
                    <div class="flex">
                        <mat-icon class="text-red-400 mr-2" [svgIcon]="'heroicons_solid:exclamation-triangle'"></mat-icon>
                        <span class="text-base text-red-700">{{ error }}</span>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
