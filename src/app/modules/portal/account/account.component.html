<div class="w-full mx-auto mt-8">
    <!-- Page Header -->
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold leading-none tracking-tight text-gray-900">Clinic Details</h1>
        <p class="mt-2 text-gray-600">Following information is publicly displayed, be careful!</p>
    </div>

    <!-- Main Content Container -->
    <div class="max-w-5xl mx-auto">
        <!-- Logo and Banner Section -->
        <div class="bg-white rounded-lg shadow-sm p-8 mb-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Clinic Logo Section -->
                <div class="text-center lg:text-left">
                    <h2 class="text-xl font-semibold mb-4">Clinic Logo</h2>
                    <div class="flex flex-col items-center lg:items-start">
                        <div class="relative flex items-center justify-center w-32 h-32 overflow-hidden ring-4 ring-gray-200 rounded-2xl mb-4">
                            <ng-container *ngIf="accountForm.get('logo')?.value; else logoPlaceholder">
                                <img class="object-cover w-full h-full" [src]="accountForm.get('logo')?.value" alt="Clinic Logo">
                            </ng-container>
                            <ng-template #logoPlaceholder>
                                <div class="flex items-center justify-center w-full h-full bg-gray-100">
                                    <mat-icon class="icon-size-12 text-gray-400" svgIcon="heroicons_outline:camera"></mat-icon>
                                </div>
                            </ng-template>
                        </div>
                        <input #logoFileInput type="file" accept="image/*" class="hidden" (change)="onLogoSelected($event)">
                        <button mat-stroked-button color="primary" (click)="logoFileInput.click()">
                            Upload Logo
                        </button>
                    </div>
                </div>

                <!-- Clinic Banner Section -->
                <div class="text-center lg:text-left">
                    <h2 class="text-xl font-semibold mb-4">Clinic Banner</h2>
                    <div class="flex flex-col items-center lg:items-start">
                        <div class="relative w-full h-32 overflow-hidden ring-4 ring-gray-200 rounded-lg mb-4">
                            <ng-container *ngIf="accountForm.get('banner')?.value; else bannerPlaceholder">
                                <img class="object-cover w-full h-full" [src]="accountForm.get('banner')?.value" alt="Clinic Banner">
                            </ng-container>
                            <ng-template #bannerPlaceholder>
                                <div class="flex items-center justify-center w-full h-full bg-gray-100">
                                    <mat-icon class="icon-size-12 text-gray-400" svgIcon="heroicons_outline:camera"></mat-icon>
                                </div>
                            </ng-template>
                        </div>
                        <input #bannerFileInput type="file" accept="image/*" class="hidden" (change)="onBannerSelected($event)">
                        <button mat-stroked-button color="primary" (click)="bannerFileInput.click()">
                            Upload Banner
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Clinic Information Form -->
        <div class="bg-white rounded-lg shadow-sm p-8 mb-8">
            <form [formGroup]="accountForm">
                <!-- Basic Information Section -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-900 mb-6">Basic Information</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Clinic Name -->
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Clinic Name</mat-label>
                            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:building-office-2'" matPrefix></mat-icon>
                            <input [formControlName]="'name'" matInput />
                        </mat-form-field>

                        <!-- Email -->
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Email</mat-label>
                            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:envelope'" matPrefix></mat-icon>
                            <input [formControlName]="'email'" matInput />
                        </mat-form-field>

                        <!-- Phone -->
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Phone Number</mat-label>
                            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:phone'" matPrefix></mat-icon>
                            <input [formControlName]="'phone'" matInput />
                        </mat-form-field>
                    </div>

                    <!-- Description -->
                    <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                        <mat-label>About</mat-label>
                        <textarea matInput [formControlName]="'description'" rows="4" 
                                  placeholder="Brief description for your profile. Basic HTML and Emoji are allowed."></textarea>
                    </mat-form-field>
                </div>

                <!-- Address Information Section -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-900 mb-6">Address Information</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Address -->
                        <div class="md:col-span-2">
                            <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                                <mat-label>Address</mat-label>
                                <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:map-pin'" matPrefix></mat-icon>
                                <input [formControlName]="'address'" matInput />
                            </mat-form-field>
                        </div>

                        <!-- Country -->
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Country</mat-label>
                            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:globe-americas'" matPrefix></mat-icon>
                            <mat-select [formControlName]="'country'">
                                <mat-option value="United States">United States</mat-option>
                                <mat-option value="Canada">Canada</mat-option>
                                <mat-option value="United Kingdom">United Kingdom</mat-option>
                                <mat-option value="Germany">Germany</mat-option>
                                <mat-option value="Australia">Australia</mat-option>
                            </mat-select>
                        </mat-form-field>

                        <!-- State -->
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>State</mat-label>
                            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:map-pin'" matPrefix></mat-icon>
                            <input [formControlName]="'state'" matInput />
                        </mat-form-field>

                        <!-- City -->
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>City</mat-label>
                            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:map-pin'" matPrefix></mat-icon>
                            <input [formControlName]="'city'" matInput />
                        </mat-form-field>

                        <!-- Zip Code -->
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Zip Code</mat-label>
                            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:map-pin'" matPrefix></mat-icon>
                            <input [formControlName]="'zipcode'" matInput />
                        </mat-form-field>
                    </div>
                </div>

                <!-- Gallery Section -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-900 mb-6">Gallery Photos</h2>
                    <div class="text-center">
                        <input #galleryFileInput type="file" accept="image/*" multiple class="hidden" (change)="onGallerySelected($event)">
                        <button mat-flat-button color="primary" (click)="galleryFileInput.click()" class="mb-6">
                            <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
                            <span class="ml-2">Select Photos</span>
                        </button>
                        
                        <!-- Gallery Preview -->
                        <div *ngIf="accountForm.get('gallery_collection')?.value?.length > 0" 
                             class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                            <div *ngFor="let img of accountForm.get('gallery_collection')?.value; let i = index" 
                                 class="relative group">
                                <img [src]="img" class="w-full h-24 object-cover rounded-lg border-2 border-gray-200">
                                <button type="button" (click)="removeGalleryImage(i)"
                                        class="absolute top-1 right-1 w-6 h-6 bg-red-500 text-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                                    <mat-icon class="icon-size-4">close</mat-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-center gap-4 pt-6 border-t border-gray-200">
                    <button mat-stroked-button type="button" class="px-8">Cancel</button>
                    <button mat-flat-button type="button" [color]="'primary'" (click)="saveClinicDetails()" class="px-8">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
