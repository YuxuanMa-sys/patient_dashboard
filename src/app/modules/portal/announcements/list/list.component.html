<section class="w-full max-w-full mx-auto px-6 py-8">
    <!-- Header with Search, Filter and New Button -->
    <div class="flex items-center gap-4 mb-8">
        <!-- Search Bar -->
        <div class="flex-1 max-w-md">
            <mat-form-field appearance="outline" class="w-full h-14" style="margin-bottom: 0;">
                <mat-icon matPrefix svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
                <input matInput placeholder="Search" [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange()" class="h-full">
            </mat-form-field>
        </div>

        <!-- Month Selector -->
        <div class="min-w-40">
            <mat-form-field appearance="outline" class="w-full h-14" style="margin-bottom: 0;">
                <mat-icon matPrefix svgIcon="heroicons_outline:calendar-days"></mat-icon>
                <mat-select [(ngModel)]="selectedMonth" (ngModelChange)="onMonthChange()" placeholder="Month" class="h-full">
                    <mat-option *ngFor="let month of months" [value]="month.value">
                        {{ month.label }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <!-- Spacer to push New button to the right -->
        <div class="flex-1"></div>

        <!-- New Button -->
        <div class="flex items-center">
            <button mat-flat-button color="primary" (click)="createOrUpdate('add')" 
                    class="h-14 px-6 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors">
                <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
                <span class="ml-2">New Announcement</span>
            </button>
        </div>
    </div>

    <!-- Announcements Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-6">
        <div *ngFor="let item of filteredAnnouncements" 
             class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition-shadow duration-200 cursor-pointer relative"
             (click)="createOrUpdate(item)">
            <!-- Image Section -->
            <div class="relative">
                <img class="w-full h-48 object-cover" 
                     [src]="item?.image || 'images/cards/01-320x200.jpg'" 
                     [alt]="item.title">
            </div>

            <!-- Content Section -->
            <div class="p-6 pb-16">
                <!-- Title -->
                <h3 class="text-xl font-semibold text-gray-900 mb-3">
                    {{ item.title }}
                </h3>

                <!-- Description -->
                <p class="text-gray-600 text-sm leading-relaxed mb-4">
                    {{ (item.description | slice: 0:100) + (item.description?.length > 100 ? '...' : '') }}
                </p>
            </div>

            <!-- Bottom Section with Date and Action Buttons -->
            <div class="absolute bottom-0 left-0 right-0 p-6 pt-4">
                <div class="flex items-center justify-between">
                    <!-- Date added -->
                    <span class="text-sm text-gray-500">
                        {{ item?.createdAt?.toDate() | date: 'dd.MM.yy' }}
                    </span>

                    <!-- Action buttons -->
                    <div class="flex items-center space-x-2">
                        <button mat-icon-button (click)="$event.stopPropagation(); createOrUpdate(item)" 
                                class="w-8 h-8 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-full">
                            <mat-icon class="text-sm" svgIcon="heroicons_outline:pencil"></mat-icon>
                        </button>
                        <button mat-icon-button (click)="$event.stopPropagation(); deleteData(item.id)" 
                                class="w-8 h-8 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-full">
                            <mat-icon class="text-sm" svgIcon="heroicons_outline:trash"></mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-12">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && filteredAnnouncements.length === 0" class="text-center py-12">
        <img class="mx-auto h-32 w-32 opacity-50" src="icons/magnifying-glass.svg" alt="No announcements">
        <h3 class="mt-4 text-lg font-medium text-gray-900">No announcements found</h3>
        <p class="mt-2 text-sm text-gray-500">
            <span *ngIf="searchQuery || selectedMonth">
                Try adjusting your search filters or 
            </span>
            <button class="text-blue-600 hover:text-blue-800" (click)="createOrUpdate('add')">create a new announcement</button>
        </p>
    </div>
</section>
