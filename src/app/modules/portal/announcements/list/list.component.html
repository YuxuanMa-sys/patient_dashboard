<section class="w-full max-w-full mx-auto px-6 py-8">
    <!-- Header with Search, Filter and New Button -->
    <div class="flex flex-wrap items-center gap-3 mb-8">
        <!-- Search Bar -->
        <div class="w-96">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <mat-icon class="h-5 w-5 text-gray-400" svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
                </div>
                <input type="text" 
                       placeholder="Search" 
                       [(ngModel)]="searchQuery" 
                       (ngModelChange)="onSearchChange()"
                       class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-full text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent rounded-input">
            </div>
        </div>

        <!-- Month Selector -->
        <div class="relative min-w-36" [ngClass]="{'filter-active-parent': selectedMonth}">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <img src="/icons/calender_filter.png" alt="Calendar" class="h-5 w-5" />
            </div>
            <select [(ngModel)]="selectedMonth" 
                    (ngModelChange)="onMonthChange()"
                    [ngClass]="{'filter-active': selectedMonth}"
                    class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-full text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none bg-white cursor-pointer rounded-input"
                    style="-webkit-appearance: none; -moz-appearance: none; appearance: none; background-image: none;">
                <option value="">Month</option>
                <option *ngFor="let month of months" [value]="month.value">
                    {{ month.label }}
                </option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                <mat-icon class="h-4 w-4 text-gray-400" svgIcon="heroicons_outline:chevron-down"></mat-icon>
            </div>
        </div>

        <!-- Spacer to push button to the right -->
        <div class="flex-1"></div>

        <!-- Create Button -->
        <button mat-flat-button color="primary" (click)="createOrUpdate('add')" 
                class="h-12 px-6 rounded-full font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors whitespace-nowrap">
            <span>
              + Create {{ activeTab === 'promotions' ? 'Promotion' : 'Announcement' }}
            </span>
        </button>
    </div>

    <!-- Tabs for Clinic Updates -->
    <div class="flex gap-4 mb-6">
      <button class="tab-btn" [class.active]="activeTab === 'announcements'" (click)="activeTab = 'announcements'">Announcements</button>
      <button class="tab-btn" [class.active]="activeTab === 'promotions'" (click)="activeTab = 'promotions'">Promotions</button>
    </div>

    <!-- Announcements Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-7">
        <div *ngFor="let item of visibleCards" 
             class="announcement-card bg-white rounded-2xl shadow-md hover:shadow-lg transition-shadow duration-200 cursor-pointer flex flex-col p-7 relative border border-gray-100 hover:bg-gray-50"
             (click)="createOrUpdate(item)">
            <div class="flex items-center gap-3 mb-4">
                <img *ngIf="item?.image" [src]="item.image" alt="Announcement" class="w-12 h-12 rounded-lg object-cover bg-gray-100" />
                <div *ngIf="!item?.image" class="w-12 h-12 rounded-lg flex items-center justify-center bg-blue-50">
                    <mat-icon class="text-blue-600 text-2xl" svgIcon="heroicons_solid:megaphone"></mat-icon>
                </div>
                <div class="flex-1"></div>
                <div class="text-xs text-gray-400 font-medium text-right whitespace-nowrap">{{ item.createdAt.toDate() | date: 'MMM d, yyyy' }}</div>
            </div>
            <div class="flex items-center gap-2 mb-2">
                <span *ngIf="activeTab === 'promotions'" class="badge badge-promotion">Promotion</span>
                <span *ngIf="activeTab !== 'promotions'" class="badge badge-announcement">Announcement</span>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2 truncate">{{ item.title }}</h3>
            <p class="text-gray-500 text-[15px] leading-relaxed mb-4 line-clamp-3">{{ item.description }}</p>
            <div class="flex items-center gap-2 mt-auto justify-end">
                <button mat-icon-button (click)="$event.stopPropagation(); createOrUpdate(item)" matTooltip="Edit" aria-label="Edit announcement" class="text-gray-500 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-full">
                    <mat-icon svgIcon="heroicons_outline:pencil"></mat-icon>
                </button>
                <button mat-icon-button (click)="$event.stopPropagation(); deleteData(item.id)" matTooltip="Delete" aria-label="Delete announcement" class="text-gray-500 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 rounded-full">
                    <mat-icon svgIcon="heroicons_outline:trash"></mat-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-12">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && filteredAnnouncements.length === 0" class="text-center py-12">
        <img class="mx-auto h-32 w-32 opacity-50" src="icons/magnifying-glass.svg" alt="No announcements">
        <h3 class="mt-4 text-lg font-medium text-gray-900">No announcements found</h3>
        <p class="mt-2 text-sm text-gray-500">
            <span *ngIf="searchQuery || selectedMonth">
                Try adjusting your search filters or 
            </span>
            <button class="text-blue-600 hover:text-blue-800" (click)="createOrUpdate('add')">create a new announcement</button>
        </p>
    </div>
</section>
