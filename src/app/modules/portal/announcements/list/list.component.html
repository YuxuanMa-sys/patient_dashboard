<section class="w-full max-w-full mx-auto px-6 py-8">
    <!-- Header with Search, Filter and New Button -->
    <div class="flex flex-wrap items-center gap-3 mb-8">
        <!-- Search Bar -->
        <div class="w-96">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <mat-icon class="h-5 w-5 text-gray-400" svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
                </div>
                <input type="text" 
                       placeholder="Search" 
                       [(ngModel)]="searchQuery" 
                       (ngModelChange)="onSearchChange()"
                       class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-full text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent rounded-input">
            </div>
        </div>

        <!-- Month Selector -->
        <div class="relative min-w-36">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <mat-icon class="h-5 w-5 text-gray-400" svgIcon="heroicons_outline:calendar-days"></mat-icon>
            </div>
            <select [(ngModel)]="selectedMonth" 
                    (ngModelChange)="onMonthChange()"
                    class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-full text-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none bg-white cursor-pointer rounded-input"
                    style="-webkit-appearance: none; -moz-appearance: none; appearance: none; background-image: none;">
                <option value="">Month</option>
                <option *ngFor="let month of months" [value]="month.value">
                    {{ month.label }}
                </option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                <mat-icon class="h-4 w-4 text-gray-400" svgIcon="heroicons_outline:chevron-down"></mat-icon>
            </div>
        </div>

        <!-- Spacer to push button to the right -->
        <div class="flex-1"></div>

        <!-- Create Button -->
        <button mat-flat-button color="primary" (click)="createOrUpdate('add')" 
                class="h-12 px-6 rounded-full font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors whitespace-nowrap">
            <span>+ Create Announcement</span>
        </button>
    </div>

    <!-- Announcements Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-6">
        <div *ngFor="let item of filteredAnnouncements" 
             class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition-shadow duration-200 cursor-pointer relative flex flex-col"
             (click)="createOrUpdate(item)">
            <!-- Image Section -->
            <div class="relative">
                <img class="w-full h-48 object-cover" 
                     [src]="item?.image || 'images/cards/01-320x200.jpg'" 
                     [alt]="item.title">
            </div>

            <!-- Content Section -->
            <div class="p-6 flex-1 flex flex-col">
                <!-- Title -->
                <h3 class="text-xl font-semibold text-gray-900 mb-3">
                    {{ item.title }}
                </h3>

                <!-- Description -->
                <p class="text-gray-600 text-sm leading-relaxed mb-4 flex-1">
                    {{ item.description }}
                </p>

                <!-- Bottom Section with Date and Action Buttons -->
                <div class="flex items-center justify-between mt-auto">
                    <!-- Date added -->
                    <span class="text-sm text-blue-600 font-medium">
                        Date added
                    </span>

                    <!-- Action buttons -->
                    <div class="flex items-center space-x-2">
                        <button mat-icon-button (click)="$event.stopPropagation(); createOrUpdate(item)" 
                                class="w-6 h-6 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-full">
                            <mat-icon class="text-xs" svgIcon="heroicons_outline:pencil"></mat-icon>
                        </button>
                        <button mat-icon-button (click)="$event.stopPropagation(); deleteData(item.id)" 
                                class="w-6 h-6 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-full">
                            <mat-icon class="text-xs" svgIcon="heroicons_outline:trash"></mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-12">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && filteredAnnouncements.length === 0" class="text-center py-12">
        <img class="mx-auto h-32 w-32 opacity-50" src="icons/magnifying-glass.svg" alt="No announcements">
        <h3 class="mt-4 text-lg font-medium text-gray-900">No announcements found</h3>
        <p class="mt-2 text-sm text-gray-500">
            <span *ngIf="searchQuery || selectedMonth">
                Try adjusting your search filters or 
            </span>
            <button class="text-blue-600 hover:text-blue-800" (click)="createOrUpdate('add')">create a new announcement</button>
        </p>
    </div>
</section>
