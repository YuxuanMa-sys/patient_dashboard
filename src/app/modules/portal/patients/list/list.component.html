<section id="upcoming" class="w-full max-w-screen-xl mx-auto">

    <div class="flex items-center justify-between w-full py-3 px-2">
        <div>
            <h2 class="text-2xl font-medium tracking-normal leading-8 text-dark"> Patients List
            </h2>
        </div>

        <div class="mt-4 sm:mt-0">
            <!-- Upload button -->
            <button mat-flat-button [color]="'primary'">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Add Patient </span>
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1  gap-6 w-full mt-2">
        <!-- Recent transactions table -->

        <div class="flex flex-col flex-auto sm:mb-10 bg-card shadow rounded-sm overflow-hidden sm:overflow-y-auto">
            <div class="overflow-x-auto">
                <ng-container>
                    <table class="w-full bg-transparent" mat-table matSort [dataSource]="data"
                        [trackBy]="trackByFn" #recentTransactionsTable1>

                        <!-- Name -->
                        <ng-container matColumnDef="name" class="custom-name-column">
                            <th mat-header-cell *matHeaderCellDef>
                                <span class="font-normal"> Name & picture </span>
                            </th>
                            <td mat-cell *matCellDef="let transaction">
                                <div class="flex items-center min-w-44 cursor-pointer"  [routerLink]="transaction.id + '/details'">
                                    <div class="relative flex flex-0 items-center justify-center w-12 h-12 mr-2 rounded-full overflow-hidden border">
                                        <!-- Check for profile picture URL and fall back to imageData -->
                                        <img
                                            class="w-10"
                                            *ngIf="transaction?.profilePictureUrl; else fallbackImage"
                                            [alt]="'transaction thumbnail image'"
                                            [src]="transaction?.profilePictureUrl">
                                        <ng-template #fallbackImage>
                                            <img
                                                class="w-10"
                                                *ngIf="imageData"
                                                [alt]="'Fallback thumbnail image'"
                                                [src]="imageData?.path">
                                            <div class="flex items-center justify-center w-full h-full text-xs font-normal rounded-full leading-none text-center uppercase"
                                                 *ngIf="!imageData">
                                                NO THUMB
                                            </div>
                                        </ng-template>
                                    </div>
                                    <div class="flex flex-col min-w-0">
                                        <div class="font-normal leading-none">
                                            {{transaction.fname}}
                                            {{transaction.lname}}
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </ng-container>

                        <!-- Ty -->
                        <ng-container matColumnDef="gender">
                            <th mat-header-cell *matHeaderCellDef class="">
                                <span class="font-normal">Gender</span>
                            </th>
                            <td mat-cell *matCellDef="let transaction" class="">
                                <div class="min-w-28">{{transaction.gender}}</div>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="phone">
                            <th mat-header-cell *matHeaderCellDef class="">
                                <span class="font-normal">Phone</span>
                            </th>
                            <td mat-cell *matCellDef="let transaction" class="">
                                <div class="min-w-28">{{ transaction?.number }}</div>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="status">
                            <th mat-header-cell *matHeaderCellDef class="text-center">
                                <span class="font-normal">Status</span>
                            </th>
                            <td mat-cell *matCellDef="let transaction">
                                <span
                                    class="inline-flex items-center font-normal text-xs px-2.5 py-0.5 rounded-full tracking-wide uppercase"
                                    [ngClass]="{
                                    'bg-primary-200 text-blue-800 dark:bg-primary-600 dark:text-primary-50': transaction.status === 'Active',
                                    'bg-yellow-200 text-yellow-800 dark:bg-yellow-600 dark:text-yellow-50': transaction.status === 'Pending',
                                }">
                                    <span
                                        class="leading-relaxed whitespace-nowrap">{{transaction.status}}</span>
                                </span>

                            </td>
                        </ng-container>

                        <!-- Date -->
                        <ng-container matColumnDef="date added">
                            <th mat-header-cell *matHeaderCellDef>
                                <span class="font-normal"> Date Added </span>

                            </th>
                            <td mat-cell *matCellDef="let transaction">
                                <span class="pr-6 whitespace-nowrap">
                                    {{ transaction?.createdAt?.toDate() | date: "medium" }}
                                </span>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef class="text-center">
                                <span class="font-normal">Action</span>
                            </th>
                            <td mat-cell *matCellDef="let transaction" class="text-center">
                                <div class="flex items-center justify-center space-x-3 min-w-44">
                                    <button
                                        class="fuse-mat-button-small rounded-[6px] max-h-6 font-normal  button-secondary"
                                        mat-stroked-button type="button" [routerLink]="transaction.id + '/details'">
                                        View Details
                                    </button>

                                </div>
                            </td>
                        </ng-container>

                        <tr class="" mat-header-row *matHeaderRowDef="tableColumn"></tr>
                        <tr class="order-row h-16" mat-row *matRowDef="let row; columns: tableColumn;"></tr>
                    </table>
                </ng-container>


                <ng-container *ngIf="!loading && data.length > 0; else noData">
                </ng-container>

                <ng-template #noData>
                    <div class="flex flex-col flex-auto w-full">
                        <div class="m-auto px-4"> <img class="w-80" [alt]="'transaction thumbnail image'"
                                src="icons/magnifying-glass.svg"></div>

                        <div
                            class="p-8 pt-0 sm:pt-0 sm:p-16 text-2xl font-normal tracking-tight text-center max-w-md align-center m-auto">
                            You don't have any Patients
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>


    </div>


</section>
