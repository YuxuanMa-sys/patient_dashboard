<section class="w-full max-w-full mx-auto px-6 py-8">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-2xl font-semibold text-gray-900">Notifications</h1>
    </div>

    <!-- Notifications List -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <ng-container *ngIf="!loading && notifications.length > 0; else noData">
            <div class="divide-y divide-gray-100">
                <div *ngFor="let notification of notifications; let first = first" 
                     class="group p-4 hover:bg-gray-50 transition-colors duration-200"
                     [ngClass]="{'border-l-4 border-blue-500 bg-blue-50': first}">
                    
                    <div class="flex items-start space-x-4">
                        <!-- User Avatar -->
                        <div class="flex-shrink-0">
                            <div class="w-12 h-12 rounded-full overflow-hidden">
                                <img class="w-full h-full object-cover" 
                                     [src]="getUserAvatar(notification)" 
                                     [alt]="getUserName(notification)"
                                     (error)="$event.target.src='images/avatars/brian-hughes.jpg'">
                            </div>
                        </div>

                        <!-- Notification Content -->
                        <div class="flex-1 min-w-0">
                            <!-- Brief Message with Timestamp -->
                            <div class="flex items-start justify-between">
                                <div class="flex-1">
                                    <!-- Main message with larger font -->
                                    <p class="text-base font-medium text-gray-900 leading-tight">
                                        {{ getBriefMessage(notification) }}
                                        <span class="text-sm text-gray-500 font-normal"> on {{ getExactTimestamp(notification) }}</span>
                                    </p>
                                    
                                    <!-- Expanded Full Message (only for this specific notification) -->
                                    <div *ngIf="isNotificationExpanded(notification.id)" 
                                         class="mt-3 p-3 bg-gray-50 rounded-lg border-l-2 border-blue-400">
                                        <p class="text-sm text-gray-700 leading-relaxed mb-2">
                                            {{ getFullMessage(notification) }}
                                        </p>
                                        <p class="text-xs text-gray-500 font-medium">
                                            Exact time: {{ getExactTimestamp(notification) }}
                                        </p>
                                    </div>
                                </div>

                                <!-- See Details & Actions -->
                                <div class="flex items-center space-x-2 ml-4">
                                    <button (click)="toggleNotificationDetails(notification.id)" 
                                            class="text-sm text-blue-600 hover:text-blue-800 font-medium transition-colors whitespace-nowrap">
                                        {{ isNotificationExpanded(notification.id) ? 'Hide Details' : 'See Details' }}
                                    </button>
                                    
                                    <button (click)="deleteNotification(notification.id)" 
                                            class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition-all">
                                        <mat-icon class="w-4 h-4">close</mat-icon>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>

        <!-- Loading State -->
        <div *ngIf="loading" class="flex justify-center items-center py-12">
            <mat-spinner diameter="40"></mat-spinner>
        </div>

        <!-- Empty State -->
        <ng-template #noData>
            <div class="flex flex-col items-center justify-center py-12">
                <img class="w-32 h-32 opacity-50 mb-4" src="icons/notification.svg" alt="No notifications">
                <h3 class="text-lg font-medium text-gray-900 mb-2">No notifications</h3>
                <p class="text-sm text-gray-500">You're all caught up! No new notifications to display.</p>
            </div>
        </ng-template>
    </div>
</section>
