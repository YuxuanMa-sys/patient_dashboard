<section id="upcoming" class="w-full max-w-screen-xl mx-auto">

    <div class="flex items-center justify-between w-full py-3 px-2">
        <div>
            <h2 class="text-2xl font-medium tracking-normal leading-8 text-dark">Promotion
            </h2>
        </div>

        <div class="mt-4 sm:mt-0">
            <!-- Upload button -->
            <button mat-flat-button [color]="'primary'">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Add Promotion </span>
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1  gap-6 w-full mt-2">

        <div class="flex flex-col flex-auto sm:mb-10 overflow-hidden p-5">
            <div class="overflow-x-auto">
                <ng-container>
                    <!-- Grid layout for announcements -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
                        <!-- Announcement card -->
                        <div class="relative group flex flex-col bg-white shadow-md rounded-lg overflow-hidden hover:shadow-xl transition-shadow duration-300" *ngFor="let item of announcements">
                            <!-- Announcement Image -->
                            <img class="w-full h-56 object-contain transition-transform duration-300 transform group-hover:scale-105"
                                 [src]="item?.announcement_image ? item?.announcement_image : 'images/cards/01-320x200.jpg'"
                                 alt="Announcement Image" />

                            <!-- Content Section -->
                            <div class="p-6">
                                <!-- Title -->
                                <h3 class="text-xl font-bold text-gray-800 group-hover:text-blue-600 transition-colors duration-300">
                                    {{ item.announcement_title }}
                                </h3>

                                <!-- Dates -->
                                <div class="mt-2 text-gray-500 text-sm space-y-1">
                                    <span>Start: {{ item.start_date?.toDate() | date: 'medium' }}</span>
                                    <br />
                                    <span>End: {{ item.end_date?.toDate() | date: 'medium' }}</span>
                                </div>

                                <!-- Description -->
                                <p class="mt-4 text-gray-700 text-sm leading-6">
                                    {{ item.announcement_desc | slice: 0:100 }}... <!-- Limiting the description -->
                                </p>
                            </div>

                            <!-- Promotion Type Badge -->
                            <div class="absolute top-3 left-3 bg-blue-600 text-white text-xs font-semibold px-2 py-1 rounded">
                                {{ item.announcement_type }}
                            </div>

                            <!-- Hover Effect Overlay (Optional) -->
                            <div class="absolute inset-0 bg-black bg-opacity-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        </div>
                    </div>
                </ng-container>

                <!-- No Data Template -->
                <ng-container *ngIf="!loading && announcements.length > 0; else noData"></ng-container>

                <ng-template #noData>
                    <div class="flex flex-col flex-auto w-full">
                        <div class="m-auto px-4">
                            <img class="w-80" alt="No data image" src="icons/magnifying-glass.svg">
                        </div>
                        <div class="p-8 pt-0 sm:pt-0 sm:p-16 text-2xl font-normal tracking-tight text-center max-w-md align-center m-auto">
                            You don't have any promotions
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>



    </div>


</section>
