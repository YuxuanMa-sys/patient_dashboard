<section class="providers-section w-full max-w-full mx-auto px-6 py-8">
    <!-- Header with Search and Add Button -->
    <div class="flex items-center justify-between mb-6">
        <!-- Search Input -->
        <div class="relative w-80">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <mat-icon class="h-5 w-5 text-gray-400" svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
            </div>
            <input type="text" 
                   placeholder="Search" 
                   [(ngModel)]="searchQuery" 
                   (ngModelChange)="onSearchChange()"
                   class="w-full pl-12 pr-4 py-3 border border-gray-200 rounded-full text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>

        <!-- Add Provider Button -->
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full text-sm font-medium transition-colors duration-200" 
                (click)="createOrUpdate('add')">
            Add a Provider
        </button>
    </div>

    <!-- Providers Table -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 border-b border-gray-100">
                <tr>
                    <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">Provider Name</th>
                    <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">Provider Type</th>
                    <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">Provider ID</th>
                    <th class="px-6 py-4 text-left text-sm font-medium text-gray-600">Color</th>
                    <th class="px-6 py-4 text-right text-sm font-medium text-gray-600">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
                <tr *ngFor="let provider of filteredProviders; trackBy: trackByFn" 
                    class="hover:bg-gray-50 transition-colors duration-150">
                    <!-- Provider Name with Avatar -->
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-3">
                            <img class="h-10 w-10 rounded-full object-cover" 
                                 [src]="getProviderAvatar(provider)" 
                                 [alt]="provider.name"
                                 (error)="$event.target.src='images/avatars/male-01.jpg'; $event.target.onerror=null;">
                            <div class="text-sm font-medium text-gray-900">
                                {{ provider.name }}
                            </div>
                        </div>
                    </td>
                    
                    <!-- Provider Type -->
                    <td class="px-6 py-4">
                        <div class="text-sm text-gray-600">
                            {{ getProviderType(provider) }}
                        </div>
                    </td>
                    
                    <!-- Provider ID -->
                    <td class="px-6 py-4">
                        <div class="text-sm text-gray-600">
                            {{ getProviderId(provider) }}
                        </div>
                    </td>
                    
                    <!-- Color -->
                    <td class="px-6 py-4">
                        <div class="w-6 h-6 rounded-full" 
                             [style.background-color]="provider.color || '#0056FB'">
                        </div>
                    </td>
                    
                    <!-- Actions -->
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end space-x-4">
                            <button class="text-blue-600 hover:text-blue-800 text-sm font-medium transition-colors duration-150" 
                                    (click)="createOrUpdate(provider)">
                                Edit Details
                            </button>
                            <button class="text-red-600 hover:text-red-800 text-sm font-medium transition-colors duration-150" 
                                    (click)="deleteData(provider.id)">
                                Remove
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Loading State -->
        <div *ngIf="loading" class="flex justify-center items-center py-12">
            <mat-progress-spinner diameter="40"></mat-progress-spinner>
            <span class="ml-4 text-gray-600">Loading providers...</span>
        </div>

        <!-- Empty State -->
        <div *ngIf="!loading && filteredProviders.length === 0" class="text-center py-12">
            <div class="flex items-center justify-center w-20 h-20 bg-gray-100 rounded-full mx-auto mb-6">
                <mat-icon class="w-10 h-10 text-gray-400" [svgIcon]="'heroicons_solid:user-group'"></mat-icon>
            </div>
            <h3 class="text-lg font-semibold text-gray-900 mb-2">No providers found</h3>
            <p class="text-base text-gray-500 mb-6">
                <span *ngIf="searchQuery">
                    No providers match your search criteria. Try adjusting your search or 
                </span>
                <button class="text-blue-600 hover:text-blue-800 font-medium underline" (click)="createOrUpdate('add')">
                    add a new provider
                </button>
            </p>
        </div>

        <!-- Error State -->
        <div *ngIf="error" class="text-center py-12">
            <div class="flex items-center justify-center w-20 h-20 bg-red-100 rounded-full mx-auto mb-6">
                <mat-icon class="w-10 h-10 text-red-500" [svgIcon]="'heroicons_solid:exclamation-triangle'"></mat-icon>
            </div>
            <h3 class="text-lg font-semibold text-gray-900 mb-2">Error Loading Providers</h3>
            <p class="text-red-600 mb-6 text-base">{{ error }}</p>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors duration-200" 
                    (click)="getData()">
                Try Again
            </button>
        </div>
    </div>
</section>
