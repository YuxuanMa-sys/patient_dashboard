<section class="providers-section w-full max-w-full mx-auto px-6 py-8">
    <!-- Header with Search and Filters -->
    <div class="mb-8">
        <div class="flex flex-wrap items-center gap-3 mb-6">
            <!-- Search Input -->
            <div class="min-w-60 max-w-xs w-full">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <mat-icon class="h-5 w-5 text-gray-400" svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
                    </div>
                    <input type="text" 
                           placeholder="Search providers..." 
                           [(ngModel)]="searchQuery" 
                           (ngModelChange)="onSearchChange()"
                           class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-base placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#0056FB] focus:border-transparent bg-white shadow-sm transition-all duration-200 rounded-input">
                </div>
            </div>

            <!-- Add Provider Button -->
            <button class="add-provider-btn bg-[#0056FB] hover:bg-[#0041c4] text-white px-6 py-3 rounded-xl text-base font-semibold shadow transition-all duration-200 flex items-center ml-auto focus:outline-none focus:ring-2 focus:ring-[#0056FB] focus:ring-offset-2" 
                    (click)="createOrUpdate('add')">
                <mat-icon class="h-5 w-5 mr-2 text-white" svgIcon="heroicons_solid:plus"></mat-icon>
                Add Provider
            </button>
        </div>
    </div>

    <!-- Providers Table -->
    <div class="bg-white shadow-lg rounded-2xl overflow-hidden border border-gray-100">
        <div class="overflow-x-auto">
            <table class="providers-table min-w-full divide-y divide-gray-100">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600 uppercase tracking-wider cursor-pointer select-none" 
                            (click)="sortBy('name')">
                            <div class="flex items-center gap-1">
                                <span>Provider Name</span>
                                <mat-icon class="ml-1 w-4 h-4 sort-icon" *ngIf="sortField === 'name'" 
                                    [svgIcon]="sortDirection === 'asc' ? 'heroicons_outline:chevron-up' : 'heroicons_outline:chevron-down'">
                                </mat-icon>
                            </div>
                        </th>
                        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600 uppercase tracking-wider cursor-pointer select-none" 
                            (click)="sortBy('type')">
                            <div class="flex items-center gap-1">
                                <span>Type</span>
                                <mat-icon class="ml-1 w-4 h-4 sort-icon" *ngIf="sortField === 'type'" 
                                    [svgIcon]="sortDirection === 'asc' ? 'heroicons_outline:chevron-up' : 'heroicons_outline:chevron-down'">
                                </mat-icon>
                            </div>
                        </th>
                        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600 uppercase tracking-wider cursor-pointer select-none" 
                            (click)="sortBy('id')">
                            <div class="flex items-center gap-1">
                                <span>ID</span>
                                <mat-icon class="ml-1 w-4 h-4 sort-icon" *ngIf="sortField === 'id'" 
                                    [svgIcon]="sortDirection === 'asc' ? 'heroicons_outline:chevron-up' : 'heroicons_outline:chevron-down'">
                                </mat-icon>
                            </div>
                        </th>
                        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600 uppercase tracking-wider">Color</th>
                        <th class="px-6 py-4 text-right text-sm font-semibold text-gray-600 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-100">
                    <tr *ngFor="let provider of filteredProviders; trackBy: trackByFn" 
                        class="group hover:bg-[#F5F8FF] transition-all duration-200 animate-fadeInUp">
                        <!-- Provider Name with Avatar -->
                        <td class="px-6 py-4 whitespace-nowrap w-64 provider-name-cell align-middle">
                            <div class="flex items-center gap-4">
                                <div class="flex-shrink-0">
                                    <img class="provider-avatar h-12 w-12 rounded-full object-cover border-2 border-gray-200 shadow-sm transition-transform duration-200" 
                                         [src]="getProviderAvatar(provider)" 
                                         [alt]="provider.name"
                                         (error)="$event.target.src='images/avatars/male-01.jpg'; $event.target.onerror=null;">
                                </div>
                                <div class="min-w-0 flex-1">
                                    <div class="text-base font-semibold text-gray-900 truncate">
                                        {{ provider.name }}
                                    </div>
                                </div>
                            </div>
                        </td>
                        <!-- Provider Type -->
                        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-700 w-40 align-middle">
                            <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full bg-gray-50 border border-gray-200 text-xs font-medium text-gray-700">
                                <mat-icon class="w-4 h-4 text-[#0056FB]" svgIcon="heroicons_solid:identification"></mat-icon>
                                {{ getProviderType(provider) }}
                            </span>
                        </td>
                        <!-- Provider ID -->
                        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-500 w-32 align-middle">
                            <span class="inline-block font-mono tracking-tight text-xs bg-gray-100 rounded px-2 py-1 border border-gray-200">
                                {{ getProviderId(provider) }}
                            </span>
                        </td>
                        <!-- Color -->
                        <td class="px-6 py-4 whitespace-nowrap w-20 align-middle">
                            <div class="color-circle w-7 h-7 rounded-full border-2 border-gray-200 shadow-sm" 
                                 [style.background-color]="provider.color || '#0056FB'">
                            </div>
                        </td>
                        <!-- Actions -->
                        <td class="px-6 py-4 whitespace-nowrap text-right text-base font-medium w-40 align-middle">
                            <div class="flex items-center justify-end gap-2">
                                <button class="edit-details-btn flex items-center gap-1 text-[#0056FB] hover:text-[#003a9c] transition-all duration-200 font-semibold px-3 py-1 rounded focus:outline-none focus:ring-2 focus:ring-[#0056FB] focus:ring-offset-2" 
                                        (click)="createOrUpdate(provider)">
                                    <mat-icon class="w-4 h-4" svgIcon="heroicons_solid:pencil-square"></mat-icon>
                                    Edit
                                </button>
                                <button class="remove-btn flex items-center gap-1 text-red-600 hover:text-red-800 transition-all duration-200 font-semibold px-3 py-1 rounded focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2" 
                                        (click)="deleteData(provider.id)">
                                    <mat-icon class="w-4 h-4" svgIcon="heroicons_solid:trash"></mat-icon>
                                    Remove
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Loading State -->
            <div *ngIf="loading" class="flex justify-center items-center py-12">
                <mat-progress-spinner diameter="40"></mat-progress-spinner>
                <span class="ml-4 text-gray-600">Loading providers...</span>
            </div>

            <!-- Empty State -->
            <div *ngIf="!loading && filteredProviders.length === 0" class="text-center py-12">
                <div class="flex items-center justify-center w-20 h-20 bg-gray-100 rounded-full mx-auto mb-6">
                    <mat-icon class="w-10 h-10 text-gray-400" [svgIcon]="'heroicons_solid:user-group'"></mat-icon>
                </div>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">No providers found</h3>
                <p class="text-base text-gray-500 mb-6">
                    <span *ngIf="searchQuery">
                        No providers match your search criteria. Try adjusting your search or 
                    </span>
                    <button class="text-[#0056FB] hover:text-[#003a9c] font-semibold text-base underline underline-offset-2" (click)="createOrUpdate('add')">
                        add a new provider
                    </button>
                </p>
            </div>

            <!-- Error State -->
            <div *ngIf="error" class="text-center py-12">
                <div class="flex items-center justify-center w-20 h-20 bg-red-100 rounded-full mx-auto mb-6">
                    <mat-icon class="w-10 h-10 text-red-500" [svgIcon]="'heroicons_solid:exclamation-triangle'"></mat-icon>
                </div>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">Error Loading Providers</h3>
                <p class="text-red-600 mb-6 text-base">{{ error }}</p>
                <button class="bg-[#0056FB] hover:bg-[#003a9c] text-white px-6 py-3 rounded-lg font-semibold transition-all duration-200 text-base focus:outline-none focus:ring-2 focus:ring-[#0056FB] focus:ring-offset-2" 
                        (click)="getData()">
                    Try Again
                </button>
            </div>
        </div>
    </div>
</section>
