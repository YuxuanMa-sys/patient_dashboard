<div class="flex flex-col flex-auto min-w-0">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
        <div class="flex-1 min-w-0">
            <!-- Title -->
            <div class="mt-2">
                <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                    Clinic Services
                </h2>
            </div>
        </div>
        <!-- Actions -->
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <button mat-flat-button [color]="'primary'" (click)="addService()">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Add Service</span>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div class="flex-auto p-6 sm:p-10">
        <div class="w-full">

            <div *ngIf="isLoading" class="text-center p-8">
                Loading services...
                <!-- TODO: Add a spinner component -->
            </div>

            <div *ngIf="!isLoading && services.length === 0" class="text-center p-8 italic text-secondary">
                No services found. Click "Add Service" to create one.
            </div>

            <div *ngIf="!isLoading && services.length > 0" class="overflow-auto bg-card rounded shadow">
                <table mat-table [dataSource]="services" class="w-full">

                    <!-- Name Column -->
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef> Name </th>
                        <td mat-cell *matCellDef="let service"> {{service.name}} </td>
                    </ng-container>

                    <!-- Description Column -->
                    <ng-container matColumnDef="description">
                        <th mat-header-cell *matHeaderCellDef> Description </th>
                        <td mat-cell *matCellDef="let service"> {{service.description}} </td>
                    </ng-container>

                    <!-- Price Column -->
                    <ng-container matColumnDef="price">
                        <th mat-header-cell *matHeaderCellDef> Price </th>
                        <td mat-cell *matCellDef="let service">
                             {{service.price}}
                             <span *ngIf="service.discountedPrice" class="line-through text-sm text-secondary ml-1"> {{service.price}} </span>
                             <span *ngIf="service.discountedPrice" class="ml-1 text-green-600 font-semibold"> {{service.discountedPrice}} </span>
                        </td>
                    </ng-container>

                    <!-- Tag Column -->
                    <ng-container matColumnDef="tag">
                        <th mat-header-cell *matHeaderCellDef> Tag </th>
                        <td mat-cell *matCellDef="let service">
                            <span *ngIf="service.tag" class="px-2 py-0.5 rounded text-sm font-medium"
                                  [ngClass]="{
                                    'bg-blue-100 text-blue-800': service.tag === 'Popular',
                                    'bg-green-100 text-green-800': service.tag === 'Free Consultation',
                                    'bg-gray-100 text-gray-800': service.tag !== 'Popular' && service.tag !== 'Free Consultation'
                                  }">
                                {{service.tag}}
                            </span>
                        </td>
                    </ng-container>

                    <!-- Actions Column -->
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let service">
                            <button mat-icon-button (click)="editService(service)" matTooltip="Edit Service">
                                <mat-icon [svgIcon]="'heroicons_outline:pencil'"></mat-icon>
                            </button>
                            <button mat-icon-button (click)="deleteService(service)" matTooltip="Delete Service" color="warn">
                                <mat-icon [svgIcon]="'heroicons_outline:trash'"></mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </div>
    </div>
</div>
