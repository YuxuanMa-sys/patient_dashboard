<div class="flex flex-col flex-auto w-full">
    <div class="flex flex-wrap w-full max-w-screen-xl mx-auto py-6 px-3 ">

        <section id="upcoming" class="w-full max-w-screen-xl mx-auto">

            <div class="flex items-center justify-between w-full py-3 px-2">
                <div>
                    <h2 class="text-2xl font-medium tracking-normal leading-8 text-dark">Insurance
                    </h2>
                </div>

                <div class="mt-4 sm:mt-0">
                    <!-- Upload button -->
                    <button mat-flat-button [color]="'primary'">
                        <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                        <span class="ml-2 mr-1">Add Insurance </span>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1  gap-6 w-full mt-2">

                <div class="flex flex-col flex-auto sm:mb-10 bg-card shadow rounded-sm overflow-hidden sm:overflow-y-auto">
                    <div class="overflow-x-auto">
                        <ng-container>
                            <table class="w-full bg-transparent" mat-table matSort [dataSource]="insurance" [trackBy]="trackByFn"
                                #recentTransactionsTable1>

                                <!-- Name -->
                                <ng-container matColumnDef="name" class="custom-name-column">
                                    <th mat-header-cell *matHeaderCellDef>
                                        <span class="font-normal"> Name </span>
                                    </th>
                                    <td mat-cell *matCellDef="let transaction">
                                        {{transaction.name}}
                                    </td>
                                </ng-container>

                                <ng-container matColumnDef="create" class="custom-name-column">
                                    <th mat-header-cell *matHeaderCellDef>
                                        <span class="font-normal"> Create at </span>
                                    </th>
                                    <td mat-cell *matCellDef="let transaction">
                                        {{ transaction?.createdAt?.toDate() | date: "medium" }}
                                    </td>
                                </ng-container>

                                <ng-container matColumnDef="status">
                                    <th mat-header-cell *matHeaderCellDef class="">
                                        <span class="font-normal">Status</span>
                                    </th>
                                    <td mat-cell *matCellDef="let transaction">
                                        <span
                                            class="inline-flex items-center font-normal text-xs px-2.5 py-0.5 rounded-full tracking-wide uppercase"
                                            [ngClass]="{
                                            'bg-primary-200 text-blue-800 dark:bg-primary-600 dark:text-primary-50': transaction.status,
                                            'bg-yellow-200 text-yellow-800 dark:bg-yellow-600 dark:text-yellow-50': !transaction.status,
                                        }">
                                            <span class="leading-relaxed whitespace-nowrap">{{transaction.status ? 'Active' : 'Inactive'}}</span>
                                        </span>

                                    </td>
                                </ng-container>


                                <ng-container matColumnDef="action">
                                    <th mat-header-cell *matHeaderCellDef class="text-center">
                                        <span class="font-normal">Action</span>
                                    </th>
                                    <td mat-cell *matCellDef="let transaction" class="text-center">
                                        <div class="flex items-center justify-center space-x-3 min-w-44">
                                            <button
                                                class="fuse-mat-button-small rounded-[6px] max-h-6 font-normal  button-secondary"
                                                mat-stroked-button type="button">
                                                Edit Details
                                            </button>

                                        </div>
                                    </td>
                                </ng-container>

                                <tr class="" mat-header-row *matHeaderRowDef="tableColumn"></tr>
                                <tr class="order-row h-16" mat-row *matRowDef="let row; columns: tableColumn;"></tr>
                            </table>
                        </ng-container>


                        <ng-container *ngIf="!loading && insurance.length > 0; else noData">
                        </ng-container>

                        <ng-template #noData>
                            <div class="flex flex-col flex-auto w-full">
                                <div class="m-auto px-4"> <img class="w-80" [alt]="'transaction thumbnail image'"
                                        src="icons/magnifying-glass.svg"></div>

                                <div
                                    class="p-8 pt-0 sm:pt-0 sm:p-16 text-2xl font-normal tracking-tight text-center max-w-md align-center m-auto">
                                    You don't have any Insurance
                                </div>
                            </div>
                        </ng-template>
                    </div>
                </div>


            </div>


        </section>



    </div>
</div>
