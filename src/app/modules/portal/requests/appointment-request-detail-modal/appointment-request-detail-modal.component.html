<div class="flex flex-col w-full max-w-lg mx-auto bg-white rounded-lg shadow-lg">
  <!-- Header -->
  <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
    <h2 class="text-xl font-semibold text-gray-900">Appointment Request</h2>
    <button mat-icon-button (click)="close()">
      <mat-icon svgIcon="heroicons_outline:x-mark"></mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="px-6 py-4 max-h-96 overflow-y-auto">
    <div class="space-y-4">
      <!-- Patient Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Patient Name</label>
        <div class="bg-gray-100 rounded-lg p-3 text-sm font-medium text-gray-900">
          {{ data.patient.name }}
        </div>
      </div>

      <!-- Appointment Type -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Appointment Type</label>
        <div class="bg-gray-100 rounded-lg p-3 text-sm font-medium text-gray-900">
          {{ data.appointmentType }}
        </div>
      </div>

      <!-- Reason for Visit -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Reason for Visit</label>
        <div class="bg-gray-100 rounded-lg p-3 text-sm font-medium text-gray-900">
          {{ data.reasonForVisit }}
        </div>
      </div>

      <!-- First Preference -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">First Preference</label>
        <div class="flex items-center justify-between bg-white border border-gray-300 rounded-lg p-3">
          <span class="text-sm text-gray-900">{{ formatDateTime(data.firstPreference) }}</span>
          <mat-icon class="text-gray-400" svgIcon="heroicons_outline:clock"></mat-icon>
        </div>
      </div>

      <!-- Second Preference -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Second Preference</label>
        <div class="flex items-center justify-between bg-white border border-gray-300 rounded-lg p-3">
          <span class="text-sm text-gray-900">{{ formatDateTime(data.secondPreference) }}</span>
          <mat-icon class="text-gray-400" svgIcon="heroicons_outline:clock"></mat-icon>
        </div>
      </div>

      <!-- Third Preference -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Third Preference</label>
        <div class="flex items-center justify-between bg-white border border-gray-300 rounded-lg p-3">
          <span class="text-sm text-gray-900">{{ formatDateTime(data.thirdPreference) }}</span>
          <mat-icon class="text-gray-400" svgIcon="heroicons_outline:clock"></mat-icon>
        </div>
      </div>

      <!-- Notes -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Notes</label>
        <div class="bg-gray-100 rounded-lg p-3 min-h-[60px] text-sm text-gray-900">
          {{ data.notes || '' }}
        </div>
      </div>

      <!-- Assign Doctor -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Assign Doctor</label>
        <div class="relative">
          <select [(ngModel)]="selectedDoctor" 
                  class="w-full pl-3 pr-10 py-3 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none">
            <option value="">@</option>
            <option *ngFor="let doctor of availableDoctors" [value]="doctor.id">
              {{ doctor.name }}
            </option>
          </select>
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
            <mat-icon class="h-4 w-4 text-gray-400" svgIcon="heroicons_outline:chevron-down"></mat-icon>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="px-6 py-4 border-t border-gray-200 flex flex-col gap-3">
    <button (click)="confirmAppointment()" 
            [disabled]="!selectedDoctor"
            class="w-full bg-blue-500 hover:bg-blue-600 disabled:bg-gray-300 text-white py-3 px-4 rounded-lg font-medium transition-colors duration-200">
      Confirm Appointment
    </button>
    <button (click)="declineAppointment()" 
            class="w-full bg-red-500 hover:bg-red-600 text-white py-3 px-4 rounded-lg font-medium transition-colors duration-200">
      Decline Appointment
    </button>
    <button (click)="close()" 
            class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 px-4 rounded-lg font-medium transition-colors duration-200">
      Close
    </button>
  </div>
</div>
