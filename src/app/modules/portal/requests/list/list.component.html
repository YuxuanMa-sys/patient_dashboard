<section class="w-full max-w-full mx-auto px-4 py-6">
    <!-- Header with Search and Filters -->
    <div class="flex justify-between items-center gap-4 mb-6">
        <!-- Search -->
        <mat-form-field appearance="outline" class="w-full h-14 flex-1">
            <mat-icon matPrefix svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
            <input matInput placeholder="Search" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()">
        </mat-form-field>

        <!-- Spacer -->
        <div class="flex-1"></div>

        <!-- Appointment Type Filter -->
        <mat-form-field appearance="outline" class="w-full h-14 flex-1">
            <mat-icon matPrefix svgIcon="heroicons_outline:funnel"></mat-icon>
            <mat-select [(ngModel)]="selectedAppointmentType" (ngModelChange)="onFilterChange()" placeholder="All Types">
                <mat-option value="">All Types</mat-option>
                <mat-option value="Virtual">Virtual</mat-option>
                <mat-option value="In-Person">In-Person</mat-option>
                <mat-option value="Emergency">Emergency</mat-option>
                <mat-option value="Consultation">Consultation</mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <!-- Status Tabs -->
    <div class="flex border-b border-gray-200 mb-6">
        <button (click)="selectTab('active')" 
                [ngClass]="{'border-b-2 border-blue-500 text-blue-600': selectedTab === 'active'}"
                class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900">
            Active
        </button>
        <button (click)="selectTab('cancelled')" 
                [ngClass]="{'border-b-2 border-blue-500 text-blue-600': selectedTab === 'cancelled'}"
                class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900">
            Cancelled
        </button>
        <button (click)="selectTab('completed')" 
                [ngClass]="{'border-b-2 border-blue-500 text-blue-600': selectedTab === 'completed'}"
                class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900">
            Completed
        </button>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr class="bg-gray-50">
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Patient</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Appointment Type</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Request Date</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let request of filteredRequests" class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <img [src]="request.patient.avatar" [alt]="request.patient.name" 
                                 class="w-10 h-10 rounded-full object-cover">
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">{{ request.patient.name }}</div>
                                <div class="text-sm text-gray-500">{{ request.reasonForVisit }}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 text-xs font-medium rounded-full" 
                              [ngClass]="{
                                'bg-blue-100 text-blue-800': request.appointmentType.includes('Virtual'),
                                'bg-green-100 text-green-800': request.appointmentType.includes('In-Person'),
                                'bg-red-100 text-red-800': request.appointmentType.includes('Emergency'),
                                'bg-yellow-100 text-yellow-800': request.appointmentType.includes('Consultation')
                              }">
                            {{ request.appointmentType }}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        {{ request.requestDate | date:'dd.MM.yyyy' }}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button mat-button color="primary" (click)="viewRequestDetails(request)" 
                                class="mr-2">
                            View Details
                        </button>
                        <button mat-button color="accent" (click)="confirmRequest(request)" 
                                class="mr-2">
                            Confirm
                        </button>
                        <button mat-button color="warn" (click)="declineRequest(request)">
                            Decline
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredRequests.length === 0" class="text-center py-12">
        <div class="text-gray-500">No appointment requests found.</div>
    </div>
</section>
