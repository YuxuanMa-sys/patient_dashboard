<!-- Appointments Table -->
<div class="w-full bg-white shadow rounded-lg overflow-hidden">
    <div class="w-full overflow-x-auto">
        <table class="w-full min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 uppercase tracking-wider w-1/3">
                        Patient Name
                    </th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 uppercase tracking-wider w-1/4">
                        Appointment Type
                    </th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 uppercase tracking-wider w-1/6">
                        Request Sent at
                    </th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 uppercase tracking-wider w-1/6">
                        Status
                    </th>
                    <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 uppercase tracking-wider w-1/12">
                        Actions
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let request of filteredRequests; trackBy: trackByFn" class="hover:bg-gray-50 transition-colors duration-200">
                    <!-- Patient Name -->
                    <td class="px-6 py-4 whitespace-nowrap w-1/3">
                        <div class="flex items-center space-x-4">
                            <div class="flex-shrink-0 relative">
                                <img class="h-11 w-11 rounded-full object-cover border-2 border-gray-200" 
                                     [src]="request.patient.avatar" 
                                     [alt]="request.patient.name"
                                     onerror="this.src='assets/images/avatars/male-01.jpg'">
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-medium text-gray-900 truncate">
                                    {{ request.patient.name }}
                                </div>
                                <div class="text-sm text-gray-500 truncate">
                                    {{ request.reasonForVisit }}
                                </div>
                            </div>
                        </div>
                    </td>

                    <!-- Appointment Type -->
                    <td class="px-6 py-4 whitespace-nowrap w-1/4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                              [ngClass]="{
                                'bg-blue-100 text-blue-800': request.appointmentType.includes('Virtual'),
                                'bg-green-100 text-green-800': request.appointmentType.includes('In-Person'),
                                'bg-red-100 text-red-800': request.appointmentType.includes('Emergency'),
                                'bg-yellow-100 text-yellow-800': request.appointmentType.includes('Consultation')
                              }">
                            {{ request.appointmentType }}
                        </span>
                    </td>

                    <!-- Request Sent at -->
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 w-1/6">
                        {{ request.requestDate | date:'dd.MM.yy' }}
                    </td>

                    <!-- Status -->
                    <td class="px-6 py-4 whitespace-nowrap w-1/6">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                              [ngClass]="{
                                'bg-yellow-100 text-yellow-800': request.status === 'Pending',
                                'bg-red-100 text-red-800': request.status === 'Cancelled',
                                'bg-blue-100 text-blue-800': request.status === 'Completed'
                              }">
                            {{ request.status }}
                        </span>
                    </td>

                    <!-- Actions -->
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium w-1/12">
                        <button
                            (click)="viewRequestDetails(request)"
                            class="text-blue-600 hover:text-blue-900 font-medium transition-colors duration-200"
                        >
                            View Request Details
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Empty State -->
        <div *ngIf="!filteredRequests || filteredRequests.length === 0" class="text-center py-12">
            <div class="mx-auto h-24 w-24 text-gray-400">
                <svg fill="none" stroke="currentColor" viewBox="0 0 48 48" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M8 14v20c0 4.418 7.163 8 16 8 8.837 0 16-3.582 16-8V14m-32 0c0 4.418 7.163 8 16 8s16-3.582 16-8m-32 0C8 9.582 15.163 6 24 6s16 3.582 16 8"></path>
                </svg>
            </div>
            <h3 class="mt-2 text-sm font-medium text-gray-900">No appointment requests</h3>
            <p class="mt-1 text-sm text-gray-500">No {{ getDisplayStatus() }} appointment requests found.</p>
        </div>
    </div>
</div>
